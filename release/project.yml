name: Radar
options:
  deploymentTarget:
    macOS: "26.0"
targets:
  Radar:
    type: application
    platform: macOS
    sources:
      - path: ../main.swift
      - path: ../icon/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Radar
        PRODUCT_BUNDLE_IDENTIFIER: com.emil.radar
        INFOPLIST_FILE: ../Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 4AR298V292
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        ARCHS: arm64
